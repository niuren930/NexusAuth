spring:
  config:
    import:
      # 配置中心可选：本地未上传对应 dataId 时直接跳过
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地首次连接自动创建业务库 nexusauth_system
    url: jdbc:mysql://localhost:3306/nexusauth_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 5s

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.nexusauth.domain
  configuration:
    map-underscore-to-camel-case: true
    # 本地开发打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
